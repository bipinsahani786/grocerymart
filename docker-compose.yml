services:
  db:
    image: postgres:15-alpine
    container_name: grocerymart_db
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grocerymart_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grocerymart_backend
    restart: "no"
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/grocerymart_db?schema=public
      - PORT=5000
      - JWT_SECRET=your_jwt_secret_here
      # Add any other required environment variables here
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grocerymart_frontend
    restart: "no"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  adminer:
    image: adminer
    container_name: grocerymart_adminer
    restart: "no"
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
